<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Timeline of the first 100 days after an acquisition: access, group reporting, shared model, baseline, and one AI workflow in shadow mode.">
  <rect width="960" height="540" rx="18" fill="#11152b" stroke="#283057"/>

  <!-- Header -->
  <g fill="#8d94b8" font-size="12" font-weight="700" letter-spacing="1.5">
    <text x="40" y="44">WORKSTREAM</text>
    <text x="240" y="44">DAYS AFTER CLOSE</text>
  </g>
  <g fill="#abb2d0" font-size="12" text-anchor="middle">
    <text x="240" y="70">0</text>
    <text x="308" y="70">10</text>
    <text x="444" y="70">30</text>
    <text x="648" y="70">60</text>
    <text x="852" y="70">90</text>
    <text x="920" y="70">100</text>
  </g>

  <!-- Grid -->
  <g stroke="#283057" stroke-width="1" stroke-dasharray="3 5">
    <path d="M240 82V418"/>
    <path d="M308 82V418"/>
    <path d="M444 82V418"/>
    <path d="M648 82V418"/>
    <path d="M852 82V418"/>
    <path d="M920 82V418"/>
  </g>

  <!-- Lane labels -->
  <g fill="#eef1fb" font-size="15" font-weight="700">
    <text x="40" y="118">Access</text>
    <text x="40" y="184">Group reporting</text>
    <text x="40" y="250">Shared model</text>
    <text x="40" y="316">Baseline</text>
    <text x="40" y="382">AI workflow</text>
  </g>
  <g fill="#8d94b8" font-size="12">
    <text x="40" y="136">Days 1–10</text>
    <text x="40" y="202">Days 10–30</text>
    <text x="40" y="268">Days 30–60</text>
    <text x="40" y="334">Days 30–60</text>
    <text x="40" y="400">Days 60–100</text>
  </g>

  <!-- Bars -->
  <rect x="240" y="96" width="68" height="50" rx="10" fill="#1a2039" stroke="#7488f6"/>
  <rect x="308" y="162" width="136" height="50" rx="10" fill="#1a2039" stroke="#7488f6"/>
  <rect x="444" y="228" width="204" height="50" rx="10" fill="#1a2039" stroke="#7488f6"/>
  <rect x="444" y="294" width="204" height="50" rx="10" fill="#1a2039" stroke="#ff7a4d" stroke-dasharray="6 4"/>
  <rect x="648" y="360" width="200" height="50" rx="10" fill="#1a2039" stroke="#7488f6"/>
  <rect x="856" y="360" width="64" height="50" rx="10" fill="#2a3470" stroke="#7488f6"/>

  <!-- Bar text -->
  <g fill="#abb2d0" font-size="12">
    <text x="320" y="118">Read-only accounts, first raw load,</text>
    <text x="320" y="134">inventory of documents and reports</text>
    <text x="456" y="184">The company appears in the group report,</text>
    <text x="456" y="200">reconciled, with the gaps listed</text>
  </g>
  <g fill="#eef1fb" font-size="13" font-weight="600" text-anchor="middle">
    <text x="546" y="250">Mappings, KPI definitions,</text>
    <text x="546" y="266">first identity match</text>
    <text x="546" y="316">Measure three workflows</text>
    <text x="546" y="332">as they are done today</text>
    <text x="748" y="382">Shadow mode</text>
    <text x="748" y="398" fill="#abb2d0" font-weight="400" font-size="12">AI runs beside the staff, unseen</text>
  </g>
  <g fill="#eef1fb" font-size="12" font-weight="700" text-anchor="middle">
    <text x="888" y="381">Go /</text>
    <text x="888" y="397">no-go</text>
  </g>

  <!-- Rules -->
  <rect x="40" y="440" width="880" height="60" rx="12" fill="#0e1326" stroke="#ff7a4d" stroke-dasharray="6 4"/>
  <text x="60" y="465" fill="#ff7a4d" font-size="12" font-weight="700" letter-spacing="1.5">RULES FOR ALL 100 DAYS</text>
  <text x="60" y="486" fill="#abb2d0" font-size="12">No changes to the acquired company's systems · nothing is automated before it is measured · no margin promise yet</text>
</svg>
